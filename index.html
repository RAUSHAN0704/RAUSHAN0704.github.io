<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Durga Puja Samiti Sarmera - Donor Search</title>
    <meta name="description" content="Search and view last year's donation details by name at Durga Puja Samiti Sarmera. Thank you for supporting the community!"/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #121212;
            color: #ddd;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.3);
            z-index: 1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(30, 30, 30, 0.85);
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: #ddd;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #f8e71c, #4caf50, #00bcd4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite alternate;
            margin: 0;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ff6b6b, 0 0 10px #f8e71c, 0 0 20px #4caf50;
            }
            to {
                text-shadow: 0 0 10px #00bcd4, 0 0 20px #4caf50, 0 0 30px #f8e71c;
            }
        }

        .header span {
            display: block;
            font-size: 14px;
            color: #bbb;
            margin-top: 4px;
        }

        .header p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ccc;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        select, input {
            padding: 12px 15px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
            background-color: #222;
            color: #ddd;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        select:focus, input:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 5px rgba(255,107,107,0.7);
            outline: none;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #ff3b3b;
            transform: translateY(-2px);
        }

        #result {
            margin-top: 25px;
            background-color: rgba(30,30,30,0.9);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #555;
        }

        th {
            background-color: #333;
            text-align: left;
        }

        tr:nth-child(even) {
            background-color: #2a2a2a;
        }

        .no-results {
            font-style: italic;
            color: #aaa;
        }

        .thank-you-message {
            margin-top: 15px;
            padding: 12px;
            background-color: #2e7d32;
            color: #e8f5e9;
            border: 1px solid #1b5e20;
            border-radius: 8px;
            display: none;
            transition: background-color 0.3s, color 0.3s;
        }

        .loading {
            margin-top: 20px;
            display: none;
            font-style: italic;
        }

        .download-btn {
            margin-top: 10px;
            background-color: #28a745;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nameInput = document.querySelector('input[name="name"]');
            nameInput.addEventListener("input", handleAutocomplete);
        });

        let allData = [];
        let currentFiltered = [];

        async function handleSearch(event) {
            event.preventDefault();

            const name = document.querySelector('input[name="name"]').value.trim().toLowerCase();
            const inputType = document.querySelector('select[name="inputType"]').value;
            const resultDiv = document.getElementById("result");
            const thankYou = document.querySelector(".thank-you-message");
            const loading = document.querySelector(".loading");

            resultDiv.style.display = 'none';
            thankYou.style.display = 'none';
            loading.style.display = 'block';
            resultDiv.innerHTML = '';

            if (!name) {
                loading.style.display = 'none';
                resultDiv.innerHTML = '<p class="no-results">Please enter a name to search.</p>';
                resultDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`data/${inputType}_data.csv`);
                const csvText = await response.text();

                allData = Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true
                }).data;

                currentFiltered = allData.filter(row => row.name.toLowerCase().includes(name));

                if (currentFiltered.length === 0) {
                    loading.style.display = 'none';
                    resultDiv.innerHTML = `<p class="no-results">No results found for "${name}".</p>`;
                    resultDiv.style.display = 'block';
                } else {
                    displayResults(currentFiltered);
                    thankYou.querySelector("#donorName").textContent = name;
                    thankYou.style.display = 'block';
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="no-results">Error: ${error.message}</p>`;
                resultDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayResults(data) {
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = '';

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            const headers = Object.keys(data[0]);
            const headerRow = document.createElement('tr');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header.charAt(0).toUpperCase() + header.slice(1);
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            data.forEach(item => {
                const row = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = item[header];
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            resultDiv.appendChild(table);

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = "Download Results";
            downloadBtn.classList.add("download-btn");
            downloadBtn.onclick = () => downloadCSV(data, headers);
            resultDiv.appendChild(downloadBtn);

            resultDiv.style.display = 'block';
        }

        function downloadCSV(data, headers) {
            const csv = Papa.unparse({ fields: headers, data: data });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', 'donation_results.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleAutocomplete(event) {
            const name = event.target.value.trim().toLowerCase();
            if (!name || allData.length === 0) return;

            const suggestions = allData
                .filter(row => row.name.toLowerCase().includes(name))
                .slice(0, 5)
                .map(row => row.name);

            let datalist = document.getElementById("nameSuggestions");
            if (!datalist) {
                datalist = document.createElement("datalist");
                datalist.id = "nameSuggestions";
                document.body.appendChild(datalist);
                event.target.setAttribute("list", "nameSuggestions");
            }
            datalist.innerHTML = '';
            suggestions.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                datalist.appendChild(option);
            });
        }
    </script>
</head>
<body>
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="videos/donation.mp4" type="video/mp4" />
        <source src="videos/donation.webm" type="video/webm" />
        <source src="videos/donation.ogv" type="video/ogg" />
        Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>

    <div class="container">
        <div class="header">
            <h1>Durga Puja Samiti Sarmera</h1>
            <span>(ESTD. 1937)</span>
            <p>Thank you for your generous contributions last year! Search below to view your donation details.</p>
        </div>

        <form id="searchForm" onsubmit="handleSearch(event)">
            <select name="inputType" required>
                <option value="" disabled selected>Select Type</option>
                <option value="bazaar">Bazaar Chanda</option>
                <option value="office">Office Chanda</option>
                <option value="gramin">Gramin Chanda</option>
                <option value="patna">Patna Chanda</option>
                <option value="navyuvak" selected>Navyuvak Chanda</option>
            </select>
            <input type="text" name="name" placeholder="Enter name" required />
            <button type="submit">Search</button>
        </form>

        <div class="loading">Loading data...</div>

        <div class="thank-you-message">
            Thank you, <span id="donorName"></span>, for your support!
        </div>

        <div id="result"></div>
    </div>
</body>
</html>
